<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" href="data:,">
    <title>Vibe Game</title>
    <style>
        :root {
            --page-bg: #071924;
            --panel-bg: rgba(13, 43, 59, 0.86);
            --panel-border: rgba(221, 248, 255, 0.48);
            --text: #f5fcff;
            --muted: #b9d8e1;
            --accent: #65e2a4;
            --warn: #ffd36a;
            --shell-gap: 12px;
            --hud-gap: 10px;
            --map-toggle-width: 78px;
            --reroll-width: 112px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            width: 100%;
            height: 100%;
        }

        body { 
            margin: 0; 
            background: radial-gradient(circle at 50% 10%, #164761 0, var(--page-bg) 62%);
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100svh;
            height: 100dvh;
            width: 100%;
            padding: var(--shell-gap);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .game-shell {
            position: relative;
            width: min(100%, 1680px);
            height: min(calc(100dvh - (var(--shell-gap) * 2)), 945px);
            min-height: min(520px, calc(100dvh - (var(--shell-gap) * 2)));
            border: 2px solid rgba(232, 250, 255, 0.5);
            border-radius: 12px;
            overflow: hidden;
            background: #59c9ee;
            box-shadow: 0 28px 90px rgba(0, 13, 25, 0.5);
        }

        #three-game { 
            width: 100%;
            height: 100%;
            position: absolute;
            inset: 0;
        }

        #three-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .hud {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .hud-cluster {
            position: absolute;
            display: flex;
            gap: 8px;
            align-items: center;
            padding: var(--hud-gap);
            color: var(--text);
        }

        .hud-top {
            top: 0;
            left: 0;
            right: calc(var(--map-toggle-width) + var(--reroll-width) + (var(--hud-gap) * 3));
        }

        .hud-bottom {
            right: 0;
            bottom: 0;
            align-items: flex-end;
            justify-content: flex-end;
            max-width: min(100%, 720px);
        }

        .hud-panel,
        .stat-chip {
            border: 1px solid var(--panel-border);
            border-radius: 11px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 28px rgba(0, 18, 30, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }

        .hud-panel {
            width: min(100%, 320px);
            min-width: 0;
            padding: 10px 12px;
        }

        .brand-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .brand {
            min-width: 0;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .status-pill {
            flex: 0 0 auto;
            min-width: 62px;
            padding: 4px 8px;
            border-radius: 999px;
            background: rgba(154, 209, 123, 0.16);
            color: var(--accent);
            font-size: 12px;
            font-weight: 700;
            text-align: center;
        }

        .status-pill[data-status="solo"] {
            background: rgba(244, 198, 109, 0.16);
            color: var(--warn);
        }

        button {
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            background: rgba(238, 246, 223, 0.08);
            color: var(--text);
            font: inherit;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: rgba(154, 209, 123, 0.18);
        }

        button.is-active,
        button[aria-pressed="true"] {
            border-color: rgba(56, 255, 156, 0.5);
            background: rgba(56, 255, 156, 0.16);
            color: #dfffee;
        }

        .quest-line {
            margin-top: 7px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.35;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .stat-chip {
            flex: 0 1 102px;
            min-width: 92px;
            padding: 8px 10px;
            overflow: hidden;
        }

        .stat-chip.location-chip {
            flex-basis: 150px;
            min-width: 130px;
        }

        .debug-stat {
            display: none;
        }

        .reroll-button {
            position: absolute;
            top: var(--hud-gap);
            right: calc(var(--map-toggle-width) + (var(--hud-gap) * 2));
            z-index: 5;
            display: flex;
            width: var(--reroll-width);
            height: 40px;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 8px 12px;
            border-radius: 11px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            pointer-events: auto;
            box-shadow: 0 10px 28px rgba(0, 18, 30, 0.24);
        }

        .reroll-button svg {
            display: block;
            width: 18px;
            height: 18px;
            flex: 0 0 auto;
        }

        .stat-label {
            display: block;
            color: var(--muted);
            font-size: 10px;
            line-height: 1.1;
            text-transform: uppercase;
            letter-spacing: 0;
        }

        .stat-value {
            display: block;
            margin-top: 4px;
            font-size: 13px;
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .admin-toggle {
            position: absolute;
            top: var(--hud-gap);
            right: var(--hud-gap);
            z-index: 5;
            width: var(--map-toggle-width);
            height: 40px;
            pointer-events: auto;
            background: var(--panel-bg);
            border-radius: 11px;
            backdrop-filter: blur(12px);
        }

        .admin-panel {
            position: absolute;
            top: calc(var(--hud-gap) + 44px);
            right: var(--hud-gap);
            z-index: 6;
            display: none;
            width: min(380px, calc(100% - (var(--hud-gap) * 2)));
            max-height: calc(100% - (var(--hud-gap) + 64px));
            padding: 12px;
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            background: rgba(8, 34, 48, 0.94);
            backdrop-filter: blur(16px);
            pointer-events: auto;
            overflow: auto;
        }

        .admin-panel.is-open {
            display: block;
        }

        .admin-head,
        .combat-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .admin-title,
        .combat-title {
            font-size: 14px;
            font-weight: 800;
        }

        .icon-button {
            width: 32px;
            height: 32px;
            padding: 0;
        }

        .admin-actions,
        .combat-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .admin-actions button,
        .combat-actions button {
            min-height: 34px;
            padding: 7px 10px;
        }

        .world-map-panel {
            display: grid;
            gap: 10px;
            margin-top: 10px;
        }

        .world-map-card {
            position: relative;
            aspect-ratio: 16 / 9;
            border: 1px solid rgba(205, 221, 181, 0.18);
            border-radius: 8px;
            background: rgba(15, 23, 20, 0.92);
            overflow: hidden;
        }

        .world-map-image,
        .world-route-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .world-map-image {
            object-fit: cover;
        }

        .world-route-overlay {
            pointer-events: none;
        }

        .world-route-line {
            fill: none;
            stroke: rgba(255, 245, 190, 0.42);
            stroke-width: 1.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            vector-effect: non-scaling-stroke;
        }

        .world-point {
            position: absolute;
            min-width: 0;
            width: 12px;
            height: 12px;
            padding: 0;
            border-radius: 50%;
            border: 1px solid rgba(22, 27, 22, 0.82);
            background: rgba(255, 245, 190, 0.92);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.42), 0 2px 6px rgba(0, 0, 0, 0.42);
            transform: translate(-50%, -50%);
        }

        .world-point.is-major {
            width: 16px;
            height: 16px;
            background: rgba(245, 138, 75, 0.96);
        }

        .world-location-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            max-height: 180px;
            overflow: auto;
        }

        .world-location-list button {
            min-height: 34px;
            padding: 7px 9px;
            text-align: left;
        }

        .world-coordinate-row {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 8px;
        }

        .world-coordinate-row input {
            min-width: 0;
            height: 34px;
            padding: 7px 9px;
            border: 1px solid rgba(205, 221, 181, 0.18);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.28);
            color: var(--text);
            font: inherit;
            font-size: 12px;
        }

        .burg-map-card {
            position: relative;
            aspect-ratio: 4 / 3;
            border: 1px solid rgba(205, 221, 181, 0.18);
            border-radius: 8px;
            background: rgba(9, 13, 11, 0.88);
            overflow: hidden;
        }

        .burg-map-grid {
            position: absolute;
            inset: 0;
            display: grid;
        }

        .burg-map-cell {
            min-width: 0;
            min-height: 0;
        }

        .burg-map-cell.water { background: #206d83; }
        .burg-map-cell.ground { background: #557e45; }
        .burg-map-cell.ground.palette-meadow { background: #69c956; }
        .burg-map-cell.ground.palette-forest { background: #2f9e59; }
        .burg-map-cell.ground.palette-jungle { background: #19a968; }
        .burg-map-cell.ground.palette-savanna { background: #b8c950; }
        .burg-map-cell.ground.palette-desert { background: #eac46d; }
        .burg-map-cell.ground.palette-wetland { background: #63aa85; }
        .burg-map-cell.ground.palette-taiga { background: #4c9480; }
        .burg-map-cell.ground.palette-tundra { background: #c8e8e8; }
        .burg-map-cell.ground.palette-alpine { background: #91a99d; }
        .burg-map-cell.ground.palette-crystal { background: #8768d4; }
        .burg-map-cell.road,
        .burg-map-cell.palette-path { background: #e5b968; }
        .burg-map-cell.wall { background: #717b7d; }
        .burg-map-cell.building { background: #9a7652; }
        .burg-map-cell.door { background: #d7b85f; }
        .burg-map-cell.stair { background: #d9d0bb; }

        .burg-map-cell.elevation-0 { filter: brightness(0.76) saturate(0.92); }
        .burg-map-cell.elevation-1 { filter: brightness(0.88); }
        .burg-map-cell.elevation-2 { filter: brightness(0.98); }
        .burg-map-cell.elevation-3 { filter: brightness(1.07) saturate(1.04); }
        .burg-map-cell.elevation-4 { filter: brightness(1.15) saturate(1.08); }
        .burg-map-cell.elevation-5,
        .burg-map-cell.elevation-6 { filter: brightness(1.22) saturate(1.12); }

        .burg-landmark-point {
            position: absolute;
            z-index: 2;
            width: 7px;
            height: 7px;
            border: 1px solid rgba(255, 255, 255, 0.78);
            border-radius: 2px;
            background: #ffd764;
            box-shadow: 0 0 0 2px rgba(14, 24, 29, 0.74), 0 0 8px rgba(255, 215, 100, 0.7);
            transform: translate(-50%, -50%) rotate(45deg);
        }

        .burg-landmark-point.is-waterfall,
        .burg-landmark-point.is-fountain { background: #54e4ff; }
        .burg-landmark-point.is-windmill,
        .burg-landmark-point.is-overlook { background: #8ee86f; }
        .burg-landmark-point.is-banner,
        .burg-landmark-point.is-archway { background: #b994ff; }
        .burg-landmark-point.is-clock_tower,
        .burg-landmark-point.is-lantern_cluster { background: #ffb755; }

        .burg-player-point {
            position: absolute;
            z-index: 2;
            width: 10px;
            height: 10px;
            border: 2px solid rgba(7, 10, 8, 0.88);
            border-radius: 50%;
            background: #7df0a4;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.26);
            transform: translate(-50%, -50%);
        }

        .burg-player-point.remote {
            width: 8px;
            height: 8px;
            background: #82c7ff;
        }

        .burg-map-label {
            position: absolute;
            left: 8px;
            bottom: 7px;
            z-index: 3;
            max-width: calc(100% - 16px);
            padding: 4px 6px;
            border-radius: 6px;
            background: rgba(9, 13, 11, 0.72);
            color: var(--muted);
            font-size: 10px;
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .admin-message {
            min-height: 18px;
            margin-top: 8px;
            color: var(--muted);
            font-size: 12px;
        }

        .admin-message[data-tone="success"] {
            color: var(--accent);
        }

        .admin-message[data-tone="error"] {
            color: #fca5a5;
        }

        .combat-scene {
            position: absolute;
            inset: 0;
            z-index: 8;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(8, 12, 10, 0.52);
            pointer-events: auto;
        }

        .combat-scene.is-open {
            display: flex;
        }

        .combat-panel {
            width: min(720px, 100%);
            max-height: min(620px, 92%);
            padding: 14px;
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            background: rgba(13, 20, 16, 0.9);
            backdrop-filter: blur(18px);
            overflow: auto;
        }

        .combat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 12px;
        }

        .combat-card {
            padding: 10px;
            border: 1px solid rgba(205, 221, 181, 0.16);
            border-radius: 8px;
            background: rgba(238, 246, 223, 0.05);
        }

        .combat-card h3 {
            margin: 0 0 8px;
            color: var(--muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0;
        }

        .combat-list,
        .combat-log {
            display: grid;
            gap: 8px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .combat-actor {
            display: grid;
            grid-template-columns: 1fr 92px 48px;
            gap: 8px;
            align-items: center;
            font-size: 12px;
        }

        .combat-actor meter {
            width: 92px;
            height: 10px;
        }

        .combat-meta {
            display: flex;
            gap: 10px;
            margin-top: 8px;
            color: var(--muted);
            font-size: 12px;
        }

        .combat-log {
            margin-top: 12px;
            color: var(--muted);
            font-size: 12px;
        }

        .combat-log li {
            padding: 6px 8px;
            border-radius: 6px;
            background: rgba(238, 246, 223, 0.05);
        }

        @media (max-width: 720px), (max-height: 560px) {
            :root {
                --shell-gap: 0px;
                --hud-gap: max(8px, env(safe-area-inset-top), env(safe-area-inset-right), env(safe-area-inset-bottom), env(safe-area-inset-left));
                --reroll-width: 42px;
            }

            body {
                padding: 0;
            }

            .game-shell {
                width: 100%;
                height: 100dvh;
                min-height: 0;
                border-radius: 0;
                border: 0;
            }

            .hud-cluster {
                gap: 6px;
            }

            .hud-top {
                right: calc(var(--map-toggle-width) + var(--reroll-width) + (var(--hud-gap) * 3));
            }

            .reroll-button {
                padding: 9px;
            }

            .reroll-button span {
                display: none;
            }

            .hud-panel {
                width: 100%;
                padding: 8px 10px;
            }

            .stat-chip {
                min-width: 74px;
                padding: 7px 8px;
            }

            .hud-bottom {
                left: 0;
                display: grid;
                grid-template-columns: minmax(84px, 1.35fr) minmax(72px, 1.1fr) minmax(64px, .8fr) minmax(56px, .65fr) minmax(56px, .65fr);
                width: auto;
                max-width: none;
            }

            .hud-bottom .stat-chip {
                min-width: 0;
                padding: 7px 5px;
                overflow: hidden;
            }

            .stat-chip.location-chip {
                min-width: 0;
            }

            .hud-bottom .stat-label {
                font-size: 8px;
            }

            .stat-value {
                overflow: hidden;
                font-size: 10px;
                text-overflow: ellipsis;
            }

            .admin-panel {
                top: calc(var(--hud-gap) + 44px);
            }

            .combat-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
  <script type="module" crossorigin src="/assets/index-Pkpm5tpx.js"></script>
</head>
<body>
    <main class="game-shell" aria-label="Vibe Game">
        <div id="three-game"></div>
        <div class="hud" aria-live="polite">
            <section class="hud-cluster hud-top">
                <div class="hud-panel">
                    <div class="brand-row">
                        <span class="brand">Vibe Realm</span>
                        <span id="status-pill" class="status-pill">Booting</span>
                    </div>
                    <div id="region-summary" class="quest-line">Shaping the FMG frontier…</div>
                </div>
            </section>

            <section class="hud-cluster hud-bottom">
                <div class="stat-chip debug-stat">
                    <span class="stat-label">Tile</span>
                    <span id="position-readout" class="stat-value">0, 0, 0</span>
                </div>
                <div class="stat-chip debug-stat">
                    <span class="stat-label">Terrain</span>
                    <span id="zone-readout" class="stat-value">Loading</span>
                </div>
                <div class="stat-chip debug-stat">
                    <span class="stat-label">Chunk</span>
                    <span id="chunk-readout" class="stat-value">0,0</span>
                </div>
                <div class="stat-chip location-chip">
                    <span class="stat-label">Location</span>
                    <span id="location-readout" class="stat-value">Loading</span>
                </div>
                <div class="stat-chip">
                    <span class="stat-label">Biome</span>
                    <span id="biome-readout" class="stat-value">Loading</span>
                </div>
                <div class="stat-chip">
                    <span class="stat-label">Seed</span>
                    <span id="seed-readout" class="stat-value">0</span>
                </div>
                <div class="stat-chip">
                    <span class="stat-label">Wildlife</span>
                    <span id="wildlife-readout" class="stat-value">0</span>
                </div>
                <div class="stat-chip">
                    <span class="stat-label">Players</span>
                    <span id="player-count-readout" class="stat-value">1</span>
                </div>
            </section>

            <button id="world-reroll-button" class="reroll-button" type="button"
                data-testid="world-reroll" aria-label="Generate a new world variation" aria-keyshortcuts="R"
                title="Generate a new world variation (R)">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M19 7V3m0 0h-4m4 0-3.2 3.2A7 7 0 1 0 18.3 14" fill="none"
                        stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Regenerate</span>
            </button>
            <button id="admin-toggle" class="admin-toggle" type="button" aria-expanded="false" aria-controls="admin-panel" aria-keyshortcuts="M">Map</button>
            <aside id="admin-panel" class="admin-panel" aria-label="Admin panel">
                <div class="admin-head">
                    <span class="admin-title">World Map</span>
                    <button id="admin-close-button" class="icon-button" type="button" aria-label="Close admin panel">X</button>
                </div>
                <div id="world-map-panel" class="world-map-panel">
                    <div id="world-map-card" class="world-map-card" aria-label="World map"></div>
                    <div id="burg-map-card" class="burg-map-card" aria-label="Burg map"></div>
                    <div id="world-location-list" class="world-location-list"></div>
                    <div class="world-coordinate-row">
                        <input id="world-map-x-input" type="number" min="0" step="1" aria-label="World X">
                        <input id="world-map-y-input" type="number" min="0" step="1" aria-label="World Y">
                        <button id="world-teleport-button" type="button">Teleport</button>
                    </div>
                </div>
                <div class="admin-actions">
                    <button id="collision-debug-button" type="button" aria-pressed="false">Collision Area</button>
                    <button id="start-combat-button" type="button">Start Co-op Combat</button>
                </div>
                <div id="admin-message" class="admin-message"></div>
            </aside>
        </div>
        <section id="combat-scene" class="combat-scene" aria-label="Turn-based combat scene">
            <div class="combat-panel">
                <div class="combat-head">
                    <div>
                        <div class="combat-title">Co-op Turn Combat</div>
                        <div id="combat-status" class="quest-line">Waiting</div>
                    </div>
                    <button id="combat-leave-button" class="icon-button" type="button" aria-label="Leave combat">X</button>
                </div>
                <div class="combat-meta">
                    <span>Round <strong id="combat-round">1</strong></span>
                    <span>Turn <strong id="combat-turn">Waiting</strong></span>
                </div>
                <div class="combat-grid">
                    <div class="combat-card">
                        <h3>Party</h3>
                        <ul id="combat-party-list" class="combat-list"></ul>
                    </div>
                    <div class="combat-card">
                        <h3>Enemies</h3>
                        <ul id="combat-enemy-list" class="combat-list"></ul>
                    </div>
                </div>
                <div class="combat-actions">
                    <button id="combat-attack-button" type="button">Attack</button>
                    <button id="combat-guard-button" type="button">Guard</button>
                    <button id="combat-ready-button" type="button">Ready</button>
                </div>
                <ul id="combat-log" class="combat-log"></ul>
